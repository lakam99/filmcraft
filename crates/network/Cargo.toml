[package]
name = "filmcraft-network"
description = "Native RedWeb project relay client and random-access media services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
filmcraft-engine = { workspace = true }
filmcraft-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
sha2 = "0.10"
# MIT OR Apache-2.0; same pure-Rust HTTPS stack as speech model downloads.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls-rustcrypto = "0.0.2-alpha"

[dev-dependencies]
filmcraft-format = { workspace = true }
filmcraft-project = { workspace = true }
tempfile = "3"
